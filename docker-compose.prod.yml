services:
  mongodb:
    image: mongo:4.4
    container_name: grandxl-mongo-prod
    restart: always
    networks:
      - internal
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: grandxl
    # --replSet is REQUIRED for multi-document transactions (wallet, order+coupon)
    # --bind_ip_all is safe here: no ports are exposed to the host, only reachable
    # from containers on the internal network via Docker DNS
    command: --replSet rs0 --bind_ip_all
    healthcheck:
      # Initialises the replica set on first boot, no-ops on subsequent boots
      test: >
        mongo --quiet --eval
        "try { rs.status().ok } catch(e) { rs.initiate().ok }"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: grandxl-redis-prod
    restart: always
    networks:
      - internal
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: grandxl-api
    restart: always
    networks:
      - internal
    env_file: .env.production
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_SENTRY_DSN_WEB: ${VITE_SENTRY_DSN_WEB}
    container_name: grandxl-web
    restart: always
    networks:
      - internal

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: grandxl-admin
    restart: always
    networks:
      - internal
    env_file: .env.production

  driver:
    build:
      context: .
      dockerfile: apps/driver-pwa/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: grandxl-driver
    restart: always
    networks:
      - internal

  nginx:
    image: nginx:alpine
    container_name: grandxl-nginx
    restart: always
    networks:
      - internal
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_data:/var/www/certbot
    depends_on:
      - api
      - web
      - admin
      - driver

# Only nginx touches the outside world (ports 80/443).
# MongoDB and Redis have NO exposed ports — internal network only.
networks:
  internal:
    driver: bridge
    internal: false

volumes:
  mongo_data:
  redis_data:
  certbot_data:
