name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  # ── Step 1: Fast validation in CI (type-check + lint + test) ────────────────
  validate:
    name: Type Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm lint

  # ── Step 2: SSH to server → pull → docker build → up ────────────────────────
  # Building happens on the VPS so Docker layer cache is warm across deploys.
  deploy:
    name: Deploy to AWS EC2 af-south-1
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          timeout:  10m
          script: |
            set -e
            cd /home/ubuntu/grandxl

            echo "==> Pulling latest code"
            git pull origin main

            echo "==> Building Docker images"
            docker compose -f docker-compose.prod.yml build --parallel

            echo "==> Restarting services (zero-downtime rolling)"
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "==> Waiting for API health check"
            sleep 10
            docker compose -f docker-compose.prod.yml ps

            echo "==> Cleaning up unused images"
            docker image prune -f

            echo "==> Deploy complete"
